name: Quality Gate

env:
  NODE_VERSION: '26.12.0'

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  run_hardhat_tests:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - run: npm ci
      - run: npx hardhat test
